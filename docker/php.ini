date.timezone = "Asia/Tokyo"

mbstring.language = "Japanese"

error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

[PHP]
; 1回にアップロードできるファイルの最大数（ここが20になっています）
max_file_uploads = 100

; POST送信全体の最大サイズ（画像が増えるとサイズも増えるので、大きくしておきます）
post_max_size = 128M

; ファイル1つあたりの最大サイズ（必要なら変更）
upload_max_filesize = 10M

; メモリ制限（大量の画像処理にはメモリを使うので、少し増やしておくと安心です）
memory_limit = 256M